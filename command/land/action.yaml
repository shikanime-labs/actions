name: Land Command
description: Land pull request on a pull request head ref
inputs:
  base:
    default: main
    description: The base branch to rebase onto
    required: false
  email:
    default: github-actions[bot]@users.noreply.github.com
    description: Email
    required: false
  fullname:
    default: github-actions[bot]
    description: Full name
    required: false
  github-token:
    default: ${{ github.token }}
    description: The GitHub Token
    required: false
  gpg-passphrase:
    default: ""
    description: GPG private key passphrase
    required: false
  gpg-private-key:
    default: ""
    description: GPG private key for signing commits
    required: false
  permissions:
    default: write,maintain,admin
    description: Permissions to require for the command
    required: false
  pull-request-url:
    default: ${{ github.event.issue.pull_request.html_url }}
    description: The Pull Request URL
    required: false
  reaction:
    default: rocket
    description: Reaction to add to the triggering comment
    required: false
  registry:
    default: nixpkgs
    description: Nix registry to use
    required: false
  sign-commits:
    default: "false"
    description: Set to true to sign commits with GPG
    required: false
  username:
    default: github-actions
    description: Username
    required: false
runs:
  steps:
    - id: command
      uses: github/command@v2
      with:
        allowed_contexts: pull_request
        command: .land
        github_token: ${{ inputs.github-token }}
        permissions: ${{ inputs.permissions }}
        reaction: ${{ inputs.reaction }}
    - id: command-force
      uses: github/command@v2
      with:
        allowed_contexts: pull_request
        command: .force-land
        github_token: ${{ inputs.github-token }}
        permissions: ${{ inputs.permissions }}
        reaction: ${{ inputs.reaction }}
        skip_ci: true
    - id: checkout
      if:
        steps.command.outputs.continue == 'true' ||
        steps.command-force.outputs.continue == 'true'
      uses: shikanime-studio/actions/checkout@v9
      with:
        email: ${{ inputs.email }}
        fullname: ${{ inputs.fullname }}
        github-token: ${{ inputs.github-token }}
        gpg-passphrase: ${{ inputs.gpg-passphrase }}
        gpg-private-key: ${{ inputs.gpg-private-key }}
        pull-request-url: ${{ inputs.pull-request-url }}
        registry: ${{ inputs.registry }}
        sign-commits: ${{ inputs.sign-commits }}
        username: ${{ inputs.username }}
    - id: land
      continue-on-error: true
      if:
        steps.command.outputs.continue == 'true' ||
        steps.command-force.outputs.continue == 'true'
      uses: shikanime-studio/actions/land@v9
      with:
        base: ${{ inputs.base }}
        github-token: ${{ inputs.github-token }}
        method: ${{ steps.checkout.outputs.method }}
        pull-request-url: ${{ inputs.pull-request-url }}
        registry: ${{ inputs.registry }}
    - env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_PULL_REQUEST_URL: ${{ inputs.pull-request-url }}
      if: steps.land.outcome == 'failure'
      run: |
        PR_URL="$INPUT_PULL_REQUEST_URL"

        IFS=' ' read -r SCHEME HOST OWNER REPO <<<"$(
          jq -Rr 'capture("^(?<scheme>https?)://(?<host>[^/]+)/(?<owner>[^/]+)/(?<repo>[^/]+)/pull/(?<number>[0-9]+)") | "\(.scheme) \(.host) \(.owner) \(.repo)"' \
            <<<"$PR_URL"
        )"

        RUN_URL="$SCHEME://$HOST/$OWNER/$REPO/actions/runs/${{ github.run_id }}"

        BODY="$(cat <<EOF
        ### ⚠️ Cannot proceed with operation

        - logs: $RUN_URL

        > Land failed
        EOF
        )"

        gh pr comment "$PR_URL" --body "$BODY"
        exit 1
      shell: bash
  using: composite
