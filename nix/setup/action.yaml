name: Setup Nix
description: Install Nix and configure Cachix
inputs:
  cachix-auth-token:
    default: ""
    description: Cachix auth token
    required: false
  cachix-name:
    default: ""
    description: Cachix cache name
    required: false
  cachix-signing-key:
    default: ""
    description: Cachix signing key
    required: false
  extra-config:
    default: ""
    description: Extra Nix config
    required: false
  extra-platforms:
    default: ""
    description: Platforms to setup QEMU for
    required: false
  github-token:
    default: ${{ github.token }}
    description: GitHub token used by the Nix installer
    required: false
runs:
  steps:
    - if: ${{ inputs.extra-platforms != '' }}
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      with:
        platforms: ${{ inputs.extra-platforms }}
    - id: extra-platforms-config
      if: ${{ inputs.extra-platforms != '' }}
      run: |
        NIX_PLATFORMS=""

        IFS=',' read -ra parts <<<"$INPUT_EXTRA_PLATFORMS"
        for part in "${parts[@]}"; do
          p="$(echo "$part" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$p" ]; then
            continue
          fi

          case "$p" in
            amd64)
              NIX_PLATFORMS="$NIX_PLATFORMS x86_64-linux"
              ;;
            arm64)
              NIX_PLATFORMS="$NIX_PLATFORMS aarch64-linux"
              ;;
            *)
              echo "::warning::unsupported platform: $p"
              ;;
          esac
        done

        NIX_PLATFORMS="$(echo "$NIX_PLATFORMS" | xargs)"
        if [[ -n "$NIX_PLATFORMS" ]]; then
          echo "nix-config=extra-platforms = $NIX_PLATFORMS" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
      env:
        INPUT_EXTRA_PLATFORMS: ${{ inputs.extra-platforms }}
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          extra-system-features = kvm
          ${{ steps.extra-platforms-config.outputs.nix-config }}
          ${{ inputs.extra-config }}
        github_access_token: ${{ inputs.github-token }}
    - continue-on-error: true
      if: ${{ inputs.cachix-name != '' && inputs.cachix-auth-token != '' }}
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: ${{ inputs.cachix-name }}
        authToken: ${{ inputs.cachix-auth-token }}
        signingKey: ${{ inputs.cachix-signing-key }}
  using: composite
