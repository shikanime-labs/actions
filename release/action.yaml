name: Release
description: Create or update a GitHub release and upload workflow artifacts
inputs:
  github-token:
    default: ${{ github.token }}
    description: The GitHub Token
    required: false
  ref:
    default: ${{ github.ref }}
    description: Git ref to use for the release
    required: false
  repo:
    default: ${{ github.repository }}
    description: Target repository for the release (owner/repo)
    required: false
runs:
  steps:
    - env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_REPO: ${{ inputs.repo }}
      run: |
        REF_NAME="${INPUT_REF#refs/tags/}"
        gh release view "$REF_NAME" --repo "$INPUT_REPO" >/dev/null 2>&1 || \
          gh release create "$REF_NAME" \
            --repo "$INPUT_REPO"
      shell: bash
    - continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        merge-multiple: true
        path: artifacts
    - env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_REPO: ${{ inputs.repo }}
      run: |
        REF_NAME="${INPUT_REF#refs/tags/}"
        while IFS= read -r -d '' file; do
          gh release upload "$REF_NAME" "$file" --repo "$INPUT_REPO" --clobber
        done < <(find artifacts -type f -print0)
      shell: bash
  using: composite
