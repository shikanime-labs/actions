name: Skaffold Integration
description: Run Skaffold build and render, optionally with a profile
inputs:
  platforms:
    default: '["linux/amd64","linux/arm64"]'
    description: JSON array of target platforms
    required: false
  profile:
    description: Optional Skaffold profile name
    required: false
  push:
    default: "true"
    description: Whether to push images during build
    required: false
  otel-endpoint:
    default: ""
    description: OTLP gRPC endpoint for tracing (e.g. localhost:4317). When empty, tracing is disabled.
    required: false
outputs:
  manifest:
    description: Rendered manifest YAML
    value: ${{ steps.skaffold.outputs.manifest }}
runs:
  steps:
    - id: platform
      run: |
        SKAFFOLD_PLATFORM="$(printf '%s' "$INPUT_PLATFORMS" | jq -r 'join(",")')"
        echo "platform=$SKAFFOLD_PLATFORM" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        INPUT_PLATFORMS: ${{ inputs.platforms }}
    - id: skaffold
      run: |
        skaffold config set --global collect-metrics false
        skaffold build
        MANIFEST="$(skaffold render)"
        {
          echo 'manifest<<EOF'
          echo "$MANIFEST"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        SKAFFOLD_PLATFORM: ${{ steps.platform.outputs.platform }}
        SKAFFOLD_PROFILE: ${{ inputs.profile }}
        SKAFFOLD_PUSH: ${{ inputs.push }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel-endpoint }}
  using: composite
